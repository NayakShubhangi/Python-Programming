# TASK TWO:
# Figure out how to run Hello_World.py inside of this file (run a Python file in a .yml)
name: Running Python Script

on:
    workflow_dispatch:

jobs:
    Run_Python_Script:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
            # When cloning a repository, the clone is only accessible to the job it's cloned into.

          - name: Setup Python
            uses: actions/setup-python@v5
            with:
                python-version: "3.10"
        
          - name: Run Hello_World.py
            # We would run 'python -m pip install *module here*' to install a module that isn't built-in Python
            run: |
             python Python_Code/Hello_World.py