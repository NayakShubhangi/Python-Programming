# TASK ONE:
# Do something similar to the workflow above using this: python-version: [3.7, 3.8, 3.9]
name: Using Matrix with Multiple Values for Python Version

on:
    workflow_dispatch:

jobs:
    job1:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: [3.13, 3.12, 3.9]
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup Python
            uses: actions/setup-python@v5
            with:
                python-version: ${{ matrix.python-version }}
        
          - name: Run Hello_World.py
            run: |
             python Python_Code/Hello_World.py